spring.application.name= sb-ecom

server.port=8080

# Data Source Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/e-commerce
spring.datasource.username=hour123
spring.datasource.password=hour123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



project.image = images/

# Valid Base64, decodes to exactly 32 bytes (256 bits)
spring.app.jwtSecret=aVeryLongSecretKeyThatIsAtLeast256BitsLongAndBase64Encoded1234567890==
spring.app.jwtExpirationMs=300000
spring.ecom.app.jwtCookieName=MyCookie


frontend.url=http://localhost:5173

image.base.url=http://localhost:8080/images

logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.ecommerce.project=DEBUG